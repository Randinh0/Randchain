[package]
name = "Blockchain"
version = "0.1.0"
edition = "2024"

[lib]
name = "blockchain"
path = "src/lib.rs"

[dependencies]
sha2 = "0.10"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
k256 = { version = "0.13", features = ["ecdsa"] }
hex = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
